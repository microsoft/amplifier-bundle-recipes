[project]
name = "amplifier-module-tool-recipes"
version = "0.1.0"
description = "Tool module for executing multi-step AI agent recipes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Microsoft", email = "amplifier@microsoft.com" }
]

dependencies = [
    "pyyaml>=6.0",
    # The one execution home for schema_version:2 recipes
    # (recipe-runner-lib.v1 Core 1). This module is a thin adapter over it.
    # Imported lazily, so a legacy recipe still runs if it is absent -- but a
    # v2 recipe fails loud rather than silently falling back to caller-bound
    # resolution.
    # The library lives in this same repo's root package (hybrid bundle + CLI),
    # so it resolves from here rather than from a separate repo.
    "amplifier-recipe-runner @ git+https://github.com/microsoft/amplifier-bundle-recipes@main",
]

[project.entry-points."amplifier.modules"]
tool-recipes = "amplifier_module_tool_recipes:mount"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "amplifier-core",
]

[tool.uv.sources]
amplifier-core = { path = "../../../amplifier-core", editable = true }
# The runner library is not published yet; it now lives in this same repo's root
# package (see the repo-root pyproject.toml), so resolve it from there -- two
# directories up from this module -- rather than from a sibling checkout.
amplifier-recipe-runner = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_tool_recipes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
