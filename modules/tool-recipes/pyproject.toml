[project]
name = "amplifier-module-tool-recipes"
version = "0.1.0"
description = "Tool module for executing multi-step AI agent recipes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Microsoft", email = "amplifier@microsoft.com" }
]

dependencies = [
    "pyyaml>=6.0",
    # NOTE: amplifier-recipe-runner (the one execution home for
    # schema_version:2 recipes, recipe-runner-lib.v1 Core 1) is deliberately
    # NOT a hard dependency. Module activation installs this package with
    # `uv pip install -e <module> --no-sources`, where (a) a direct-URL dep
    # fails hatchling metadata validation without allow-direct-references,
    # and (b) the runner's own transitive URL dep on amplifier-foundation is
    # rejected by uv ("URL dependencies must be expressed as direct
    # requirements"). Both broke `amplifier update` in production (2026-09-02).
    # Instead, runner_adapter.load_runner() imports the library from this same
    # bundle's root package (src/amplifier_recipe_runner, two directories up)
    # via a sys.path fallback -- the bundle cache always ships both together.
    # Legacy recipes run without it; a v2 recipe fails loud if it is absent.
]

[project.entry-points."amplifier.modules"]
tool-recipes = "amplifier_module_tool_recipes:mount"

[project.optional-dependencies]
# Opt-in extra for standalone installs of this module OUTSIDE the bundle
# tree (where the sys.path fallback cannot find the sibling library).
runner = [
    "amplifier-recipe-runner @ git+https://github.com/microsoft/amplifier-bundle-recipes@main",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "amplifier-core",
]

[tool.hatch.metadata]
# Required for the direct-URL reference in the `runner` extra.
allow-direct-references = true

[tool.uv.sources]
amplifier-core = { path = "../../../amplifier-core", editable = true }
# The runner library is not published yet; it now lives in this same repo's root
# package (see the repo-root pyproject.toml), so resolve it from there -- two
# directories up from this module -- rather than from a sibling checkout.
amplifier-recipe-runner = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_tool_recipes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
