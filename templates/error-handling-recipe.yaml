# Error Handling Recipe Template
#
# This template demonstrates error handling strategies:
# - Retry logic for transient failures
# - Graceful degradation with on_error
# - Timeout configuration
# - Critical vs optional steps

# --- Dependency manifest (contract: recipe-dependency-manifest.v1) ----------
# schema_version 2 makes this recipe portable: every `agent:` reference below
# resolves ONLY from the declared closure here, never from the calling
# session's agent map. A caller that lacks these agents can still run it.
# Pinned to the released tag `v2.1.2`. Foundation fetches a ref with
# `git clone --branch`, which accepts a branch or a tag but NOT a commit SHA,
# so a tag is the most immutable pin a `source:` can currently express.
schema_version: 2

dependencies:
  - source: "git+https://github.com/microsoft/amplifier-foundation@v2.1.2"
    kind: bundle
    required_agents:
      - "foundation:zen-architect"
# ---------------------------------------------------------------------------

name: "my-error-handling-recipe"
description: "Recipe demonstrating comprehensive error handling patterns"
version: "1.0.0"
tags: ["error-handling", "resilience", "retry"]

context:
  input_data: ""
# NOTE: context variables reach {{...}} placeholders in *string* fields only
# (prompt, command, cwd, env values, condition, recipe path, sub-recipe context,
# while_condition/break_when). Numeric fields — retry.max_attempts, timeout,
# max_iterations, max_while_iterations — are read verbatim, never substituted,
# so they must be written as literal numbers. See the retry blocks below.

steps:
  # Critical step: Must succeed or recipe fails
  - id: "critical-validation"
    agent: "foundation:zen-architect"
    mode: "ANALYZE"
    prompt: |
      Validate {{input_data}} is valid and ready for processing.

      This step is critical - recipe cannot continue without it.
    output: "validation_result"
    timeout: 300
    # Default: on_error="fail" - recipe stops if this fails
    retry:
      # Literal integer, NOT "{{max_retries}}": numeric fields are not
      # substituted. A placeholder here fails validation, and would fail at
      # execution time too (the executor loops over max_attempts directly).
      max_attempts: 3
      backoff: "exponential"
      initial_delay: 5
      max_delay: 60

  # Risky step: External operation with retry
  - id: "fetch-external-data"
    agent: "foundation:zen-architect"
    prompt: |
      Fetch additional data needed for processing.

      This may fail due to network issues - will retry automatically.
    output: "external_data"
    timeout: 600  # Longer timeout for external operations
    retry:
      max_attempts: 5           # More retries for network operations
      backoff: "exponential"
      initial_delay: 10
      max_delay: 300

  # Optional enhancement: Continue even if fails
  - id: "optional-enhancement"
    agent: "foundation:zen-architect"
    mode: "ARCHITECT"
    prompt: |
      Enhance results with additional analysis.

      This is optional - recipe can succeed without it.
    output: "enhancement"
    timeout: 300
    on_error: "continue"  # Recipe continues even if this fails
    retry:
      max_attempts: 2     # Fewer retries for optional work

  # Process with whatever we have
  - id: "process-results"
    agent: "foundation:zen-architect"
    mode: "ANALYZE"
    prompt: |
      Process results:

      Validation: {{validation_result}}
      External data: {{external_data}}
      Enhancement: {{enhancement}}  # May be empty if enhancement failed

      Create final output handling partial results gracefully.
    output: "final_result"
    timeout: 300

# Error handling patterns demonstrated:
#
# 1. Critical steps (default on_error="fail"):
#    - Recipe stops on failure
#    - Use for validation, required inputs
#
# 2. Retry for transient failures:
#    - Network operations
#    - External services
#    - File I/O (cloud sync issues)
#
# 3. Optional steps (on_error="continue"):
#    - Enhancements
#    - Nice-to-have features
#    - Non-critical validations
#
# 4. Timeout tuning:
#    - Quick operations: 60-300 seconds
#    - Standard operations: 300-600 seconds
#    - Long operations: 600-1800 seconds
#
# 5. Known limitation — numeric fields take literals only:
#    retry.max_attempts, retry.initial_delay, retry.max_delay, timeout,
#    max_iterations and max_while_iterations are never {{substituted}}. To vary
#    them per run, pass a different recipe (or a sub-recipe path chosen by a
#    variable) rather than a placeholder in the numeric position.
#
# Usage:
#   amplifier run "execute error-handling-recipe.yaml with input_data=test.json"
