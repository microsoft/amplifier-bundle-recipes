# Multi-Step Recipe Template
#
# This template demonstrates a more complex workflow with:
# - Multiple context variables
# - Error handling
# - Agent configuration overrides
# - Progressive refinement pattern

# --- Dependency manifest (contract: recipe-dependency-manifest.v1) ----------
# schema_version 2 makes this recipe portable: every `agent:` reference below
# resolves ONLY from the declared closure here, never from the calling
# session's agent map. A caller that lacks these agents can still run it.
# Pinned to the released tag `v2.1.2`. Foundation fetches a ref with
# `git clone --branch`, which accepts a branch or a tag but NOT a commit SHA,
# so a tag is the most immutable pin a `source:` can currently express.
schema_version: 2

dependencies:
  - source: "git+https://github.com/microsoft/amplifier-foundation@v2.1.2"
    kind: bundle
    required_agents:
      - "foundation:zen-architect"
# ---------------------------------------------------------------------------

name: "my-multi-step-recipe"
description: "Multi-stage workflow with analysis, refinement, and validation"
version: "1.0.0"
tags: ["multi-step", "refinement", "validation"]

# Context: Define all variables upfront
context:
  # Required inputs
  primary_input: ""
  target: ""

  # Optional configuration
  quality_threshold: "high"  # high, medium, low
  max_iterations: 3
  auto_validate: true

  # Computed values
  output_file: "{{target}}_results.md"

steps:
  # Stage 1: Initial Analysis
  - id: "analyze"
    agent: "foundation:zen-architect"
    mode: "ANALYZE"
    prompt: |
      Analyze {{primary_input}} for {{target}}.

      Quality threshold: {{quality_threshold}}

      Provide comprehensive analysis covering:
      1. Current state
      2. Issues and opportunities
      3. Recommendations
    output: "analysis"
    timeout: 600
    retry:
      max_attempts: 3
      backoff: "exponential"

  # Stage 2: Design Improvements
  - id: "design-improvements"
    agent: "foundation:zen-architect"
    mode: "ARCHITECT"
    prompt: |
      Based on this analysis: {{analysis}}

      Design improvements for {{target}}:

      Requirements:
      - Must meet {{quality_threshold}} quality threshold
      - Maximum {{max_iterations}} iterations
      - Focus on high-impact changes

      Provide specific, actionable improvements.
    output: "improvements"
    timeout: 600

  # Stage 3: Validate (optional based on context)
  - id: "validate-improvements"
    agent: "foundation:zen-architect"
    mode: "REVIEW"
    prompt: |
      Validate these improvements: {{improvements}}

      Against analysis: {{analysis}}
      For target: {{target}}

      Check:
      1. Feasibility
      2. Impact
      3. Alignment with {{quality_threshold}} threshold

      Approve, modify, or reject each improvement.
    output: "validation"
    timeout: 300
    on_error: "continue"  # Optional step - continue even if fails

  # Stage 4: Synthesize Results
  - id: "synthesize"
    agent: "foundation:zen-architect"
    mode: "ANALYZE"
    # NOTE: this step used to carry an `agent_config:` block (a per-step
    # provider/temperature override). That field was parsed but never applied
    # by the engine, and under `schema_version: 2` it is rejected at parse
    # (recipe-dependency-manifest.v1 Core 12: it must be resolved, never
    # silently retained inert). Declare the agent's supplying bundle in
    # `dependencies:` instead; per-step provider selection uses the
    # `provider:` / `model:` step fields.
    prompt: |
      Create comprehensive report:

      Input: {{primary_input}}
      Target: {{target}}
      Analysis: {{analysis}}
      Improvements: {{improvements}}
      Validation: {{validation}}

      Generate final recommendations for {{output_file}}.

      Format as markdown with executive summary and detailed sections.
    output: "final_report"
    timeout: 300

# Usage examples:
#
# Basic:
#   amplifier run "execute multi-step-recipe.yaml with primary_input=code.py target=refactoring"
#
# With options:
#   amplifier run "execute multi-step-recipe.yaml with primary_input=docs.md target=improvement quality_threshold=medium"
#
# Expected outputs:
#   - analysis: Comprehensive analysis results
#   - improvements: Designed improvements
#   - validation: Validation results (may be empty if step failed)
#   - final_report: Complete markdown report
