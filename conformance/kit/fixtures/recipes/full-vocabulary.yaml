# A recipe that exercises the WHOLE step vocabulary in one file, so the two
# engines can be run over it and their results diffed.
#
# Every step here is deliberately workspace-independent (echo only, no file
# writes, no network) because the two engines run in two different temporary
# directories: a difference in the diff must mean a difference in SEMANTICS,
# never a difference in where the run happened.
schema_version: 2

dependencies:
  - source: bundles/supplier
    kind: bundle
    required_agents:
      - "supplier:reviewer"

name: full-vocabulary
description: Every step type the recipe vocabulary has, in one run.
version: "1.0.0"

context:
  mode: full
  budget: 30
  counter: 0

steps:
  # bash + aggressive JSON extraction from noisy stdout
  - id: emit
    type: bash
    parse_json: true
    command: |
      echo "progress line the recipe should ignore"
      echo 'and a trivial structure {} that must not win'
      echo '{"items": ["a", "b", "c"], "count": 3, "enabled": true}'
    output: payload

  # dotted-path substitution, and a templated timeout
  - id: restate
    type: bash
    timeout: "{{budget}}"
    command: echo "count={{payload.count}} enabled={{payload.enabled}}"
    output: restated

  # a condition that passes
  - id: gated-on
    type: bash
    condition: "{{mode}} == 'full'"
    command: echo ran-full
    output: gated_on

  # a condition that does not
  - id: gated-off
    type: bash
    condition: "{{mode}} == 'quick'"
    command: echo never
    output: gated_off

  # non-zero exit absorbed, with the exit code captured
  - id: absorbed
    type: bash
    on_error: continue
    output_exit_code: absorbed_code
    command: "echo to-stderr >&2; exit 7"
    output: absorbed_out

  # sequential foreach with collect
  - id: fan-out
    foreach: "{{payload.items}}"
    as: letter
    type: bash
    command: echo item-{{letter}}
    collect: fanned

  # bounded-parallel foreach: same inputs, same order out
  - id: fan-out-parallel
    foreach: "{{payload.items}}"
    as: letter
    parallel: 2
    type: bash
    command: echo par-{{letter}}
    collect: fanned_parallel

  # multi-step foreach body
  - id: compound
    foreach: "{{payload.items}}"
    as: letter
    steps:
      - id: compound-first
        type: bash
        command: echo first-{{letter}}
        output: compound_first
      - id: compound-second
        type: bash
        command: echo second-{{compound_first}}
        output: compound_second
    collect: compounded

  # convergence loop: update_context after the body, break_when after that
  - id: converge
    while_condition: "{{counter}} < 10"
    update_context:
      counter: "{{_loop_iteration}}"
    break_when: "{{counter}} >= 3"
    type: bash
    command: echo tick-{{_loop_index}}-seen-{{counter}}
    collect: ticks

  # a sub-recipe, reached by a path relative to this file
  - id: delegate
    type: recipe
    recipe: full-vocabulary-sub.yaml
    context:
      forwarded: "{{payload}}"
    output: delegated

  # the one agent step
  - id: review
    agent: "supplier:reviewer"
    prompt: Review {{payload.count}} items.
    output: verdict

  # and a step that reads it back
  - id: settle
    type: bash
    command: echo settled-{{verdict}}
    output: settled
