- id: RCP-001
  title: Versioned manifest (schema_version 2 + dependencies; unknown keys are a parse ERROR)
  contract:
    file: contracts/recipe-dependency-manifest.v1.md
    clause: "Core 1"
    quote: |
      **Versioned manifest.** A portable recipe declares `schema_version: 2` and a
      `dependencies` block. A recipe without them is a *legacy recipe* (see Core
      10). Unknown manifest keys are a parse ERROR, never silently ignored.
  disposition: GAP
  assertion:
    kind: probe
    ref: check_rcp_001_versioned_manifest
    status: planned
  work: [recipes-yh0]
  notes: >
    Measured 2026-09-01: no occurrence of `schema_version` or a `dependencies`
    block exists anywhere in this repo's recipe schema, models, or validator
    (modules/tool-recipes/amplifier_module_tool_recipes/models.py). Every recipe
    shipped here is therefore a legacy recipe under Core 10.

- id: RCP-002
  title: Dependency form — Foundation-resolvable bundle/behavior URIs, kind limited to bundle|behavior
  contract:
    file: contracts/recipe-dependency-manifest.v1.md
    clause: "Core 2"
    quote: |
      **Dependency form.** `dependencies` entries are Foundation-resolvable
      bundle/behavior source URIs (including partial behavior bundles via
      `#subdirectory=`), each optionally listing `required_agents`. v1 permits
      `kind: bundle` and `kind: behavior` only.
  disposition: GAP
  assertion:
    kind: probe
    ref: check_rcp_002_dependency_form
    status: planned
  work: [recipes-yh0]
  notes: >
    No `dependencies` entry type exists to validate. Depends on RCP-001 landing
    first (the block must exist before its entry form can be checked).

- id: RCP-003
  title: Closed-world agent resolution — never from the caller session's agent map
  contract:
    file: contracts/recipe-dependency-manifest.v1.md
    clause: "Core 3"
    quote: |
      **Closed-world agent resolution.** A step's `agent:` reference — alias or
      canonical `namespace:name` — resolves ONLY from the recipe's declared
      dependency closure (plus runner baseline). It never resolves from the
      caller session's agent map.
  disposition: GAP
  assertion:
    kind: probe
    ref: check_rcp_003_closed_world_resolution
    status: planned
  work: [recipes-3zg, recipes-6tg]
  notes: >
    Measured 2026-09-01: today's executor resolves agents from the caller session
    (executor.py:1868, `agents = self.coordinator.config.get("agents", {})`).
    Recorded as GAP and NOT as VIOLATION on the contract's own terms: every recipe
    in this repo is a legacy recipe (RCP-001), and Core 10 explicitly sanctions
    caller-bound resolution for legacy recipes run through the embedded adapter.
    The closed-world path is simply unbuilt. If a schema-v2 recipe ever resolves
    from the caller map, this row flips to VIOLATION.

- id: RCP-004
  title: Isolation by default — session built only from declared closure + runner baseline
  contract:
    file: contracts/recipe-dependency-manifest.v1.md
    clause: "Core 4"
    quote: |
      **Isolation by default.** The runner builds the execution session
      exclusively from the declared dependency closure plus runner baseline. v1
      has NO host imports beyond explicit runner ports: workspace path, approved
      provider access, approval callback, event sink, cancellation.
  disposition: GAP
  assertion:
    kind: probe
    ref: check_rcp_004_isolation_by_default
    status: planned
  work: [recipes-6tg]
  notes: >
    The "NO host imports beyond explicit runner ports" half is checkable by an
    absence probe over the runner's host surface once the runner exists; the
    port list is closed and enumerable, so no human judgment is required.

- id: RCP-005
  title: Collision is an error — duplicate agent names across the closure fail preflight
  contract:
    file: contracts/recipe-dependency-manifest.v1.md
    clause: "Core 5"
    quote: |
      **Collision is an error.** Duplicate agent names across the dependency
      closure are a preflight ERROR. A caller agent with a colliding name can
      never satisfy, alter, or override a recipe dependency.
  disposition: GAP
  assertion:
    kind: probe
    ref: check_rcp_005_collision_is_error
    status: planned
  work: [recipes-3zg]

- id: RCP-006
  title: Preflight before side effects — trust and declaration checks precede any fetch or activation
  contract:
    file: contracts/recipe-dependency-manifest.v1.md
    clause: "Core 6"
    quote: |
      **Preflight before side effects.** Trust policy is enforced BEFORE any
      remote fetch or module activation. Every declared dependency and every
      referenced agent is verified before any recipe step executes. A missing
      declaration fails naming the undeclared reference and the remedy.
  disposition: GAP
  assertion:
    kind: probe
    ref: check_rcp_006_preflight_before_side_effects
    status: planned
  work: [recipes-3zu]
  notes: >
    Ordering ("BEFORE any remote fetch or module activation") is assertable by
    observing that no fetch/activation side effect occurred on a refused run —
    a real observation, not a code-reading judgment.

- id: RCP-007
  title: Provenance recorded per run — full enumerated record in run state
  contract:
    file: contracts/recipe-dependency-manifest.v1.md
    clause: "Core 7"
    quote: |
      **Provenance recorded per run.** Run state records: recipe digest, each
      declared URI/ref, resolved immutable revision/content digest, included
      partials, agent-to-dependency provenance map, runner/foundation versions,
      and effective trust and capability policy.
  disposition: GAP
  assertion:
    kind: probe
    ref: check_rcp_007_provenance_recorded
    status: planned
  work: [recipes-3zg]
  notes: >
    The record's contents are an explicit closed list, so the probe asserts field
    presence per item rather than a subjective "enough provenance" judgment.

- id: RCP-008
  title: Lock semantics — locked/update-lock/unlocked modes; never silent lock updates or re-resolution
  contract:
    file: contracts/recipe-dependency-manifest.v1.md
    clause: "Core 8"
    quote: |
      **Lock semantics.** Lockfile is optional/generated. `locked` mode (default
      for CI) requires exact lock entries; `update-lock` rewrites explicitly;
      `unlocked` is interactive-only with a warning. Locks are never updated
      silently on run. Resume uses recorded provenance; a provenance mismatch
      fails visibly, never silently re-resolves.
  disposition: GAP
  assertion:
    kind: probe
    ref: check_rcp_008_lock_semantics
    status: planned
  work: [recipes-2kp]

- id: RCP-009
  title: Capability intersection — host ∩ runner ∩ manifest-declared needs
  contract:
    file: contracts/recipe-dependency-manifest.v1.md
    clause: "Core 9"
    quote: |
      **Capability intersection.** Effective capabilities are
      host policy ∩ runner policy ∩ manifest-declared needs.
  disposition: GAP
  assertion:
    kind: probe
    ref: check_rcp_009_capability_intersection
    status: planned
  work: [recipes-3zu]
  notes: >
    Set intersection is exactly assertable once the three inputs are addressable;
    no interpretive latitude in this clause.

- id: RCP-010
  title: Legacy mode is labeled and confined — adapter-only, labeled, warned, byte-identical; CLI rejects
  contract:
    file: contracts/recipe-dependency-manifest.v1.md
    clause: "Core 10"
    quote: |
      **Legacy mode is labeled and confined.** A legacy recipe runs ONLY through
      the embedded Amplifier tool adapter, in explicitly labeled caller-bound
      mode, with a deprecation warning. Its behavior there is byte-identical to
      pre-contract behavior (including failure when the caller lacks a referenced
      agent). The standalone `recipe-runner` CLI rejects legacy recipes with an
      actionable error.
  disposition: GAP
  assertion:
    kind: probe
    ref: check_rcp_010_legacy_labeled_and_confined
    status: planned
  work: [recipes-aew, recipes-8yo, recipes-o6f]
  notes: >
    Measured 2026-09-01: legacy recipes do run through the embedded tool adapter
    today (that is all that exists), but there is no explicit legacy label and no
    deprecation warning, and no standalone CLI exists to reject them. The
    byte-identical half is assertable only against a captured pre-contract
    baseline — that baseline is recipes-o6f's deliverable; until it exists this
    half is unassertable for want of a reference, not for want of a check.

- id: RCP-011
  title: No namespace inference — dependencies are never inferred from agent-name namespaces
  contract:
    file: contracts/recipe-dependency-manifest.v1.md
    clause: "Core 11"
    quote: |
      **No namespace inference.** The runner never infers dependencies from
      agent-name namespaces (e.g. `foundation:*`).
  disposition: OPEN-PINNED
  justification: >
    RETURNED NEED (interpretive ruling, not settleable from the contract text).
    Core 11 is a pure prohibition: it requires no behavior, it forbids one. The
    forbidden behavior is observably absent today — but only because the runner
    and its dependency concept do not exist at all. Neither GAP (nothing is
    required to be implemented) nor VIOLATION (nothing contradicts it) fits.
    The open question is whether a prohibition-only clause CONFORMS vacuously
    while its subject system is absent, or must stay pinned until a subject
    exists to be prohibited. The contract text does not settle this and this lane
    declines to guess. Pinned for an owner/protocol-authority ruling.
  assertion:
    kind: absence
    ref: check_rcp_011_no_namespace_inference
    status: planned
  notes: >
    An `absence` probe is the right instrument either way: it makes the row
    executable now and flips it the moment namespace-inference logic appears,
    which is the bidirectional-drift behavior this ledger is for. Only the
    DISPOSITION is pinned, not the check.

- id: RCP-012
  title: agent_config is resolved, not retained — implemented or rejected at parse, never inert
  contract:
    file: contracts/recipe-dependency-manifest.v1.md
    clause: "Core 12"
    quote: |
      **`agent_config` is resolved, not retained.** The historical
      parsed-but-ignored `agent_config` step field must be either implemented
      under this schema or rejected at parse — never silently retained inert.
  disposition: VIOLATION
  assertion:
    kind: probe
    ref: check_rcp_012_agent_config_not_inert
    status: planned
  work: [recipes-yh0]
  notes: >
    Measured 2026-09-01, evidence in shipped code: `agent_config` is declared on
    the step model (models.py:232), is validated only to forbid it on bash steps
    (models.py:383-385), and is read nowhere in executor.py for agent steps — the
    exact "silently retained inert" state the clause names and forbids. This is
    recorded as VIOLATION rather than GAP because the offending behavior is
    present and shipped, and the clause settles the reading itself: it names the
    historical parsed-but-ignored state as the thing that must not persist. Two
    legal exits (either satisfies the clause): implement resolution under the v2
    schema, or reject the field at parse.

