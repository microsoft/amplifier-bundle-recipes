- id: RCP-101
  title: One execution home — library owns parsing, planning, resolution, provenance, orchestration
  contract:
    file: contracts/recipe-runner-lib.v1.md
    clause: "Core 1"
    quote: |
      **One execution home.** The library (working name `amplifier-recipe-runner`)
      owns manifest parsing/validation, dependency planning and collision
      detection, resolution, provenance recording, run state, and execution
      orchestration. Every host surface is a thin adapter; no adapter carries
      workflow, resolution, or agent-catalog logic of its own.
  disposition: GAP
  assertion:
    kind: probe
    ref: check_rcp_101_one_execution_home
    status: planned
  work: [recipes-9kx, recipes-aew]
  notes: >
    The library does not exist; all workflow, resolution, and orchestration logic
    currently lives in this repo's tool module
    (modules/tool-recipes/amplifier_module_tool_recipes/executor.py). Recorded as
    GAP rather than VIOLATION because the contract's prohibition binds adapters
    once the single home exists; today's module is the only home, not a
    duplicating adapter.
    NOT-ASSERTABLE (sub-claim): "Every host surface is a thin adapter" — "thin"
    is a human architectural judgment, not a machine-checkable predicate. Named
    judgment required: an owner/architect review that each adapter carries no
    workflow, resolution, or agent-catalog logic of its own. The rest of the
    clause (ownership of each named responsibility by the library) is assertable
    by locating each responsibility's implementation.

- id: RCP-102
  title: Public API surface — validate / plan / run / resume, usable without a UI or the Amplifier CLI
  contract:
    file: contracts/recipe-runner-lib.v1.md
    clause: "Core 2"
    quote: |
      **Public API surface.** The library exposes, at minimum: `validate`
      (manifest + plan checks, no side effects), `plan` (resolved dependency plan
      and agent provenance, no execution), `run`, and `resume`. All are usable
      without a UI and without the Amplifier CLI.
  disposition: GAP
  assertion:
    kind: probe
    ref: check_rcp_102_public_api_surface
    status: planned
  work: [recipes-9kx]
  notes: >
    Fully assertable once the library exists: the four entry points are named, and
    "no side effects" / "no execution" are observable, not judgment calls.

- id: RCP-103
  title: Neutral session abstraction — coordinator is not public API
  contract:
    file: contracts/recipe-runner-lib.v1.md
    clause: "Core 3"
    quote: |
      **Neutral session abstraction.** The library defines its own execution-
      session abstraction. `coordinator` (and any Amplifier-internal session
      object) is NOT public API.
  disposition: GAP
  assertion:
    kind: probe
    ref: check_rcp_103_neutral_session_abstraction
    status: planned
  work: [recipes-9kx]
  notes: >
    Measured 2026-09-01: today's executor takes an Amplifier `coordinator`
    directly (executor.py:448) — but as its host constructor, not as a library
    public API, since no library exists. GAP, with the prohibition half checkable
    by an absence probe over the library's exported surface once it lands.

- id: RCP-104
  title: Host ports — narrow named ports only; no port grants the host's ambient agent map
  contract:
    file: contracts/recipe-runner-lib.v1.md
    clause: "Core 4"
    quote: |
      **Host ports.** Hosts integrate exclusively through narrow, explicitly named
      ports: provider access, approval callback, event sink, workspace path,
      cancellation. No port grants the host's ambient agent map to the recipe.
  disposition: GAP
  assertion:
    kind: probe
    ref: check_rcp_104_host_ports
    status: planned
  work: [recipes-9kx]
  notes: >
    The port list is closed and enumerable, and the prohibition ("no port grants
    the host's ambient agent map") is assertable by an absence probe over the port
    signatures. Pairs with RCP-003 — same isolation guarantee, other side of the
    seam.

- id: RCP-105
  title: Injectable resolver/cache policy — default Foundation BundleRegistry, embedder-injectable
  contract:
    file: contracts/recipe-runner-lib.v1.md
    clause: "Core 5"
    quote: |
      **Injectable resolver/cache policy.** The library owns a resolver interface
      with injectable policy. The default implementation uses Foundation's
      `BundleRegistry` under a runner namespace within the standard Amplifier
      cache root. Cache location is NOT part of the public semantic contract;
      embedders may inject registry/cache policy (mirrors, offline, isolation).
  disposition: GAP
  assertion:
    kind: probe
    ref: check_rcp_105_injectable_resolver_policy
    status: planned
  work: [recipes-3zg]
  notes: >
    NOT-ASSERTABLE (sub-claim): "Cache location is NOT part of the public semantic
    contract" is a statement about what the contract does not promise — no
    observable behavior can falsify it, so no probe can assert it. Named judgment
    required: a reviewer confirming no test, fixture, or downstream row depends on
    a specific cache path. The injectability half and the default implementation
    are both fully assertable.

- id: RCP-106
  title: Trust policy is a required input for remote resolution — refusal before side effects
  contract:
    file: contracts/recipe-runner-lib.v1.md
    clause: "Core 6"
    quote: |
      **Trust policy is a required input for remote resolution.** Arbitrary
      explicit URIs are permitted only WITH a caller-provided trust policy;
      CI-mode execution requires locked immutable refs. The library refuses
      remote fetch/activation that the policy disallows, before side effects.
  disposition: GAP
  assertion:
    kind: probe
    ref: check_rcp_106_trust_policy_required
    status: planned
  work: [recipes-3zu]
  notes: >
    Pairs with RCP-006 (same guarantee stated at the manifest seam). Both rows are
    kept: each contract is separately citable and separately amendable, and a
    single row cannot carry two clause anchors.

- id: RCP-107
  title: Run manifest schema — resolved graph exposed in a stable, documented shape
  contract:
    file: contracts/recipe-runner-lib.v1.md
    clause: "Core 7"
    quote: |
      **Run manifest schema.** `plan`/`run` results expose the resolved graph
      (recipe digest, canonical URIs, immutable revisions/content digests,
      agent-to-dependency provenance, versions, effective policy) in a stable,
      documented shape.
  disposition: GAP
  assertion:
    kind: probe
    ref: check_rcp_107_run_manifest_schema
    status: planned
  work: [recipes-3zg]
  notes: >
    "Stable" is assertable as a schema-snapshot comparison across runs and
    versions; "documented" is assertable as the existence of the shape's doc.
    Field presence is a closed list, so no interpretive latitude.

- id: RCP-108
  title: Error model — preflight failures are distinct, typed, and precede step execution
  contract:
    file: contracts/recipe-runner-lib.v1.md
    clause: "Core 8"
    quote: |
      **Error model.** Preflight failures (undeclared agent, collision, trust
      refusal, provenance mismatch) are distinct, typed, and occur before recipe
      steps run. A missing artifact or refused dependency is a real result, never
      a fabricated success.
  disposition: GAP
  assertion:
    kind: probe
    ref: check_rcp_108_error_model
    status: planned
  work: [recipes-9kx, recipes-3zu]
  notes: >
    Four named failure classes, each with a distinct type — assertable one probe
    per class. "Never a fabricated success" is assertable as the absence of a
    success result on a refused run.
