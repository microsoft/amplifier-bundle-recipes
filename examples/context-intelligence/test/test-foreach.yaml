# --- Dependency manifest (contract: recipe-dependency-manifest.v1) ----------
# schema_version 2 makes this recipe portable: every `agent:` reference below
# resolves ONLY from the declared closure here, never from the calling
# session's agent map. A caller that lacks these agents can still run it --
# and so does a v2 orchestrator that reaches this file as a `type: recipe`
# step, because `schema_version` is read per recipe, not inherited.
# Pinned to the released tag `v2.1.2`. Foundation fetches a ref with
# `git clone --branch`, which accepts a branch or a tag but NOT a commit SHA,
# so a tag is the most immutable pin a `source:` can currently express.
schema_version: 2

dependencies:
  - source: "git+https://github.com/microsoft/amplifier-foundation@v2.1.2"
    kind: bundle
    required_agents:
      - "foundation:zen-architect"
# ---------------------------------------------------------------------------

name: "test-foreach"
description: "Test foreach with hardcoded list"
version: "1.0.0"

context:
  test_files:
    - "/home/bkrabach/repos/recipe-dev/amplifier-core/amplifier_core/loader.py"
    - "/home/bkrabach/repos/recipe-dev/amplifier-core/amplifier_core/session.py"

steps:
  - id: "analyze-each"
    foreach: "{{test_files}}"
    as: "current_file"
    agent: "foundation:zen-architect"
    mode: "ANALYZE"
    prompt: |
      Briefly describe what this file does: {{current_file}}
      One sentence only.
    output: "description"
    collect: "all_descriptions"
    max_iterations: 5

  - id: "summarize"
    agent: "foundation:zen-architect"
    mode: "ANALYZE"
    prompt: |
      Here are file descriptions:
      {{all_descriptions}}
      
      Summarize in one paragraph.
    output: "summary"
