# --- Dependency manifest (contract: recipe-dependency-manifest.v1) ----------
# schema_version 2 makes this recipe portable: every `agent:` reference below
# resolves ONLY from the declared closure here, never from the calling
# session's agent map. A caller that lacks these agents can still run it.
# Pinned to `main`: this bundle publishes no tags, and Foundation fetches a ref
# with `git clone --branch`, which accepts a branch or a tag but NOT a commit
# SHA. `main` moves -- this pin is NOT immutable.
schema_version: 2

dependencies:
  - source: "git+https://github.com/microsoft/amplifier-bundle-recipes@main#subdirectory=behaviors/recipes.yaml"
    kind: behavior
    required_agents:
      - "recipes:recipe-author"
# ---------------------------------------------------------------------------

name: "ultra-minimal-test"
description: "Ultra minimal test using recipe-author agent"
version: "1.0.0"

context:
  task: "Say hello"

steps:
  - id: "hello"
    agent: "recipes:recipe-author"
    prompt: "Task: {{task}}. Just respond with a simple greeting."
    timeout: 60
